<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F3EE" />
    <title>LuxVM Desktop</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F3EE;
        color: #292825;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div style="display: flex; height: 100vh; width: 100vw; background-color: #111210; color: #E8E6E0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; overflow: hidden">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111210; color: #E8E6E0; }
    button, input, textarea, select { font: inherit; }
    button { transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease; }
    button:hover { filter: brightness(.97); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #A65F43; outline-offset: 2px; }
    input, textarea, select { transition: border-color 160ms ease, box-shadow 160ms ease; }
    input:focus, textarea:focus, select:focus { border-color: #A65F43 !important; box-shadow: 0 0 0 3px rgba(166,95,67,.12); }
    ::selection { background: rgba(166,95,67,.18); }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #41423D; border: 2px solid #111210; border-radius: 20px; }
    ::-webkit-scrollbar-track { background: transparent; }
    @media (max-width: 760px) { [data-luxvm-sidebar] { width: 196px !important; min-width: 196px !important; } }
    @media (max-width: 560px) { [data-luxvm-sidebar] { width: 176px !important; min-width: 176px !important; } }
  </style>
  <aside data-luxvm-sidebar="true" style="width: 228px; background-color: #171815; border-right: 1px solid #292A26; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 10px; padding: 16px; font-size: 16px; border-bottom: 1px solid #20211E"><span style="width: 10px; height: 10px; border-radius: 50%; background-color: #879078"></span><strong>LuxVM Studio</strong></div>
    <nav style="display: flex; flex-direction: column; gap: 4px; padding: 10px"><button type="button" style="text-align: left; background-color: #20211E; color: #E8E6E0; border: none; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; border-left: 3px solid #A65F43">General Chat</button><button type="button" style="text-align: left; background-color: transparent; color: #C6C2B8; border: none; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500">Voice Assistant</button><button type="button" style="text-align: left; background-color: transparent; color: #C6C2B8; border: none; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500">Codex Studio</button><button type="button" style="text-align: left; background-color: transparent; color: #C6C2B8; border: none; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500">Chess Bot</button><button type="button" style="text-align: left; background-color: transparent; color: #C6C2B8; border: none; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500">Image Studio</button></nav>
    <div style="height: 1px; background-color: #20211E; margin: 4px 0"></div>
    <div style="padding: 10px"><button type="button" style="width: 100%; background-color: #A65F43; color: #151613; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 12px">+ New Chat Thread</button></div>
    <div style="flex: 1; overflow-y: auto; padding: 0 10px 10px 10px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #C6C2B8; background-color: #30312D"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1">New Chat</span><button type="button" style="background: none; border: none; color: #9B988F; cursor: pointer; font-size: 15px; padding: 0 4px" title="Delete Chat">×</button></div>
    </div>
  </aside>
  <div style="flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background-color: #111210; border-bottom: 1px solid #292A26">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 16px"><strong> General Chat</strong><span style="font-size: 11px; padding: 3px 8px; border-radius: 12px; background-color: #111210; color: #9B988F; border: 1px solid #30312D">{models[activeTab]}</span></div>
      <div style="display: flex; gap: 10px"><button type="button" style="background-color: #A65F43; color: #151613; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500"> Settings</button></div>
    </header>
    <main style="flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; overflow-y: auto; padding: 42px 28px 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; width: 100%; justify-content: flex-start">
        <div style="max-width: min(820px, 88%); padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; background-color: transparent">
          <div style="display: flex; justify-content: space-between; gap: 16px; font-size: 11px; opacity: 0.7; margin-bottom: 4px"><span>LuxVM</span><span>{new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
          <div style="margin: 0">Welcome to LuxVM Desktop. Paste your OpenRouter key in Settings to unlock Chat, Voice, Codex, Chess, and Image Studio!</div>
        </div>
      </div>
      <div></div>
    </main>
    <form style="display: flex; width: 100%; max-width: 940px; margin: 0 auto; border-top: none; gap: 10px; padding: 14px 20px 22px; background-color: #111210"><input style="flex: 1; padding: 14px 18px; border-radius: 16px; border: 1px solid #41423D; background-color: #20211E; color: #E8E6E0; font-size: 14px; outline: none" value="" placeholder="Ask LuxVM anything…"><button type="submit" style="background-color: #E8E6E0; color: #20211E; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px" disabled>Send</button></form>
  </div>
</div>
  </body>
</html>
