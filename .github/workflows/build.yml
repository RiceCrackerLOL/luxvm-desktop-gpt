name: Build RZER Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luxvm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Audit dependency vulnerabilities
        run: npm audit --json > npm-audit.json
        continue-on-error: true

      - name: Type-check, build, and package
        run: npm run build

