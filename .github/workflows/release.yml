name: Publish RZER Windows Update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: luxvm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows update
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish to public releases repository
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.LUXVM_RELEASES_TOKEN }}
